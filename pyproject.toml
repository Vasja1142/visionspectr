[project]
name = "visionex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasja1142", email = "122717158+Vasja1142@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyside6>=6.12.0",
]

[project.scripts]
visionex = "visionex:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pyside6-project]
files = ["main.py", "main_window.py"]
